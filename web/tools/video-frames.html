<!doctype html>
<meta charset="utf-8">
<title>Video frames</title>
<style>body{margin:0;background:#4f8f5c;color:#fff;font:13px system-ui}#out img,#out canvas{max-width:100%;display:block;margin:6px 0;background:rgba(0,0,0,.15)}</style>
<div id="log"></div><div id="out"></div>
<script>
// Pull frames out of a green-screen gallop clip, key out the green, find the cleanest
// repeating stride, line frames up on body centre + feet, and pack a one-row atlas.
//   tools/video-frames.html?src=../art/video-src/horse-run.mp4&name=horse
const q = new URLSearchParams(location.search), log = m => document.getElementById('log').innerHTML += m + '<br>';
window.result = null;
(async () => {
  const v = document.createElement('video'); v.src = q.get('src'); v.muted = true; v.crossOrigin = 'anonymous';
  await new Promise(r => v.addEventListener('loadeddata', r, { once: true }));
  const W = v.videoWidth, H = v.videoHeight;
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d', { willReadFrequently: true });
  // capture every decoded frame while playing slowly (seeking can hand back stale frames)
  const frames = [], key = d => {
    for (let p = 0; p < d.length; p += 4) {
      const r = d[p], gg = d[p + 1], b = d[p + 2], spill = gg - Math.max(r, b);
      if (spill > 60 && gg > 120) d[p + 3] = 0;
      else { if (spill > 18) d[p + 3] = Math.max(0, 255 - (spill - 18) * 5); if (spill > 0) { const m = (r + b) / 2, lift = Math.min(spill, 40) * .35; d[p] = Math.min(255, r + lift); d[p + 1] = Math.min(255, m + lift); d[p + 2] = Math.min(255, b + lift); } }
    }
  };
  v.currentTime = 0; await new Promise(r => v.addEventListener('seeked', r, { once: true }));
  v.playbackRate = .25; let lastT = -1;
  await new Promise(done => {
    const grab = (now, meta) => {
      if (meta.mediaTime !== lastT) { lastT = meta.mediaTime; g.drawImage(v, 0, 0); const id = g.getImageData(0, 0, W, H); key(id.data); frames.push(id); }
      if (!v.ended) v.requestVideoFrameCallback(grab); else done();
    };
    v.requestVideoFrameCallback(grab); v.addEventListener('ended', () => setTimeout(done, 200), { once: true }); v.play();
  });
  const n = frames.length;
  log(`${n} frames ${W}x${H}`);
  // small masks for comparing poses
  const S = 4, mw = Math.ceil(W / S), mh = Math.ceil(H / S);
  const masks = frames.map(id => { const m = new Uint8Array(mw * mh); for (let y = 0; y < mh; y++) for (let x = 0; x < mw; x++) m[y * mw + x] = id.data[((y * S) * W + x * S) * 4 + 3] > 128 ? 1 : 0; return m; });
  const diff = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] ^ b[i]; return s; };
  // best loop: start i, length L (8..26), mismatch between frame i and i+L (pose) + i+1 and i+L+1 (motion)
  // one stride: the shortest loop length whose best seam is nearly as clean as the cleanest
  const byL = {};
  for (let L = 8; L <= 28; L++) for (let i = 6; i + L + 1 < n; i++) {
    const cost = diff(masks[i], masks[i + L]) + diff(masks[i + 1], masks[i + L + 1]);
    if (!byL[L] || cost < byL[L].cost) byL[L] = { i, L, cost };
  }
  const minCost = Math.min(...Object.values(byL).map(b => b.cost));
  // the stride is the first sharp dip: a local minimum far below the typical mismatch
  const Ls = Object.keys(byL).map(Number).sort((a, b) => a - b), med = Ls.map(L => byL[L].cost).sort((a, b) => a - b)[Ls.length >> 1];
  let best = Ls.map(L => byL[L]).find(b => byL[b.L - 1] && byL[b.L + 1] && b.cost < byL[b.L - 1].cost && b.cost < byL[b.L + 1].cost && b.cost < med * .3)
    || Object.values(byL).sort((a, b) => a.L - b.L).find(b => b.cost <= minCost * 1.35 + 40);
  if (q.get('L')) best = byL[+q.get('L')];
  log('cost by length: ' + Object.values(byL).map(b => b.L + ':' + b.cost).join(' '));
  log(`loop: start ${best.i}, ${best.L} frames, seam cost ${best.cost}`);
  const pick = frames.slice(best.i, best.i + best.L);
  // measure each frame: bbox, horizontal centre of mass, feet
  const meas = pick.map(id => { let x0 = W, x1 = 0, y0 = H, y1 = 0, sx = 0, k = 0; for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (id.data[(y * W + x) * 4 + 3] > 60) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; sx += x; k++; } return { x0, x1, y0, y1, cx: sx / k }; });
  // smooth the alignment anchors over the loop so drift is removed but the natural lift stays
  const avgCx = meas.reduce((s, m) => s + m.cx, 0) / meas.length, maxBottom = Math.max(...meas.map(m => m.y1));
  const halfW = Math.max(...meas.map(m => Math.max(avgCx - m.x0, m.x1 - avgCx))) + 8;
  const top = Math.min(...meas.map(m => m.y0)) - 6, cellH = maxBottom - top + 6, cellW = Math.ceil(halfW * 2);
  // fit phones: atlas no wider than 4096 px and frames no taller than 256 px
  const sc = Math.min(1, 4096 / (cellW * pick.length), 256 / cellH), cw2 = Math.floor(cellW * sc), ch2 = Math.floor(cellH * sc);
  const atlas = document.createElement('canvas'); atlas.width = cw2 * pick.length; atlas.height = ch2;
  const ag = atlas.getContext('2d'); ag.imageSmoothingQuality = 'high';
  pick.forEach((id, k) => {
    const fc = document.createElement('canvas'); fc.width = W; fc.height = H; fc.getContext('2d').putImageData(id, 0, 0);
    const shift = Math.round(avgCx - meas[k].cx) * .8; // cancel most of the treadmill drift, keep a little natural sway
    ag.drawImage(fc, avgCx - halfW - shift, top, cellW, cellH, k * cw2, 0, cw2, ch2);
  });
  document.getElementById('out').appendChild(atlas);
  const url = atlas.toDataURL('image/png');
  const res = await fetch(`http://127.0.0.1:5180/?name=${encodeURIComponent('frames-video/' + q.get('name') + '-run.png')}`, { method: 'POST', body: url });
  const info = await res.text();
  log('saved ' + info);
  window.result = { n, loop: best, cell: [cw2, ch2], frames: pick.length, info };
})().catch(e => { log('ERROR ' + e); window.result = { error: String(e) }; });
</script>
